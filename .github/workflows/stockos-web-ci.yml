# CI — StockOS web (Week 4)

# Phase 6 parallel-safe scaffolding while org migration remains Phase-0 blocked.
# RLS isolation suite is intentionally NOT claimed green until a scratch/CI
# database and migration PASS exist. Branch protection is not configured here.

name: stockos-web-ci

on:
  pull_request:
    paths:
      - 'stockos-web/**'
      - '.github/workflows/stockos-web-ci.yml'
  push:
    branches: [main, master]
    paths:
      - 'stockos-web/**'
      - '.github/workflows/stockos-web-ci.yml'

defaults:
  run:
    working-directory: stockos-web

jobs:
  typecheck-lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
          cache-dependency-path: stockos-web/package-lock.json
      - name: Install
        run: npm ci
      - name: Typecheck
        run: npx tsc --noEmit
      - name: Lint
        run: npm run lint

  # Runs only when scratch secrets are configured on the repo. Absent secrets
  # must not silently green-wash isolation — they skip with an explicit notice.
  # When secrets exist, a failing suite blocks the PR.
  rls-isolation:
    runs-on: ubuntu-latest
    needs: typecheck-lint
    if: ${{ vars.W4_RLS_CI_ENABLED == 'true' }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
          cache-dependency-path: stockos-web/package-lock.json
      - name: Install
        run: npm ci
      - name: Org-migration RLS rehearsal
        env:
          SUPABASE_SCRATCH_DB_URL: ${{ secrets.SUPABASE_SCRATCH_DB_URL }}
          SUPABASE_SCRATCH_URL: ${{ secrets.SUPABASE_SCRATCH_URL }}
          SUPABASE_SCRATCH_ANON_KEY: ${{ secrets.SUPABASE_SCRATCH_ANON_KEY }}
          SUPABASE_SCRATCH_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SCRATCH_SERVICE_ROLE_KEY }}
          SUPABASE_SCRATCH_PROJECT_REF: ${{ secrets.SUPABASE_SCRATCH_PROJECT_REF }}
          W4_TEST_OWNER_EMAIL: ${{ secrets.W4_TEST_OWNER_EMAIL }}
          W4_TEST_OWNER_PASSWORD: ${{ secrets.W4_TEST_OWNER_PASSWORD }}
          W4_TEST_OUTSIDER_EMAIL: ${{ secrets.W4_TEST_OUTSIDER_EMAIL }}
          W4_TEST_OUTSIDER_PASSWORD: ${{ secrets.W4_TEST_OUTSIDER_PASSWORD }}
        run: npm run db:test-org-migration